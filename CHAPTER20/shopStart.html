<!DOCTYPE html>
<html>
<head>
  <title>Snack Order</title>
</head>
<body>

  <h2>Snack Ordering System</h2>

  <div id="demo"></div>

  <br>
  <button onclick="checkout()">Checkout</button>
  <p id="grandTotal" style="font-weight: bold;"></p>


 <script>
/********************************
 * 1. DATA (GLOBAL VARIABLES)
 ********************************/
var nums = [1, 2, 3, 4];
var items = ["Coke", "Kit Kat", "Bar One", "Fanta"];
var prices = [7.5, 9.5, 8.5, 7.5];
var quantities = [0, 0, 0, 0];
var totals = [0.0, 0.0, 0.0, 0.0];
var totalOrderAmt = 0;


/********************************
 * 2. MODIFY DATA
 ********************************/
function add_selection(x) {
  quantities[x]++;
  update_totals(x);
}

function remove_selection(x) {
  if (quantities[x] > 0) {
    quantities[x]--;
    update_totals(x);
  }
}


/********************************
 * 3. CALCULATIONS
 ********************************/
function update_totals(index) {
  totals[index] = prices[index] * quantities[index];
  totalOrderAmt = totals.reduce((sum, val) => sum + val, 0);
  display_all();
}

function checkout() {
  document.getElementById("grandTotal").innerHTML =
    "Total Order Amount: R " + totalOrderAmt.toFixed(2);
}


/********************************
 * 4. DISPLAY
 ********************************/
function display_all() {

  var myTable = "<table border='1' cellpadding='5'>";
  myTable += "<tr>";
  myTable += "<th>Num</th>";
  myTable += "<th>Item</th>";
  myTable += "<th>Price</th>";
  myTable += "<th>Quantity</th>";
  myTable += "<th>Total</th>";
  myTable += "<th>Add</th>";
  myTable += "<th>Remove</th>";
  myTable += "</tr>";

  for (let i = 0; i < items.length; i++) {
    myTable += "<tr>";
    myTable += "<td>" + nums[i] + "</td>";
    myTable += "<td>" + items[i] + "</td>";
    myTable += "<td>R " + prices[i].toFixed(2) + "</td>";
    myTable += "<td>" + quantities[i] + "</td>";
    myTable += "<td>R " + totals[i].toFixed(2) + "</td>";
    myTable += "<td><button onclick='add_selection(" + i + ")'>Add</button></td>";
    myTable += "<td><button onclick='remove_selection(" + i + ")'>Remove</button></td>";
    myTable += "</tr>";
  }

  myTable += "</table>";
  document.getElementById("demo").innerHTML = myTable;
}


/********************************
 * 5. PAGE LOAD
 ********************************/
window.onload = function () {
  display_all();
};
</script>
